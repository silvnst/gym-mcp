kind = "mobile"
previewPath = "/gym-mobile/"
title = "Gym Tracker Mobile"
version = "1.0.0"

[[services]]
name = "expo"
paths = ["/gym-mobile/"]
localPort = 8099

[services.development]
run = "pnpm --filter @workspace/gym-mobile run dev"

[services.production.build]
run = "pnpm --filter @workspace/gym-mobile run build"

[services.production.serve]
run = "pnpm --filter @workspace/gym-mobile run serve"

[services.env]
PORT = "8099"
BASE_PATH = "/gym-mobile/"
